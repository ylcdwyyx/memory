主动性规则:
- 用户描述现象，或说「查看/查一下/看下/为什么/卡了/打不开/报错」，一律视为**已授权立即排查**：直接开跑第一轮取证（进程状态、项目约定的日志目录、截图、`git log`），带着实际发现回来对齐下一步。**不得**只回一串候选原因等用户挑一个。
- 自己列出的候选排查项是按顺序逐项验证的清单，不是需要用户澄清的分叉点。列清单的同时就把第一项查完。
- 只读动作（读日志、`ps`/进程检查、截图取文本、`git log`、`/json/list`、直调函数复现）**永远不需要请示**；可逆动作做完在总结里说明如何回退即可。
- 需要停下来确认的只有：不可逆或对外可见的动作——删文件、`git push`、发消息给第三方、改远程机器、杀别的进程、往 app 里发测试 prompt。
- 「复杂或任务重时先列步骤让用户确认」只适用于**包含上述不可逆动作的实施**；纯诊断与取证不受此限，先跑再报告。

