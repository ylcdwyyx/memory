环境:
- 操作系统: Windows 11
- Shell: PowerShell 7 (pwsh)，注意和 cmd.exe、Linux 下的 bash 有差异
编码: CSV 文件保存为 UTF-8 with BOM (utf-8-sig)
PowerShell 不支持 bash 风格的 heredoc (python - <<'PY')，请改用 here-string (@' ... '@) 或脚本文件。
使用 python -c 时，必须注意引号层级：外层用单引号，内部 Python 用双引号。
f-string 中嵌套引号建议用 row['field'] 写法避免冲突。
输出包含制表符 \t、换行 \n 时，不要让 PowerShell 抢先解释，直接交给 Python。
使用 uv pip install安装 Python 依赖
"""

